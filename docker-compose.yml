# docker-compose.yml
# Production: override env vars via .env.local or host environment variables
# Dev: defaults come from .env, override uses compose.override.yml

services:
  app:
    build: .
    # Production secrets live in .env.local, which .dockerignore deliberately
    # keeps out of the image. Symfony would read the file itself if it were
    # there — it is not, so compose has to inject it. Absent in dev, where .env
    # already supplies every default.
    env_file:
      - path: .env.local
        required: false
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost/-/health-check/liveness || exit 1
      start_period: 5s
      timeout: 10s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sendvery.rule=Host(`sendvery.com`)"
      - "traefik.http.routers.sendvery.entrypoints=websecure"
      - "traefik.http.routers.sendvery.tls.certresolver=letsencrypt"
      - "traefik.http.services.sendvery.loadbalancer.server.port=80"
    networks:
      - traefik
      - default
    restart: unless-stopped

  worker:
    build: .
    command: php bin/console messenger:consume async --time-limit=3600
    env_file:
      - path: .env.local
        required: false
    environment:
      # app already migrates on startup. Left unset, both containers reach for
      # the same lock at the same moment, and --all-or-nothing does not make
      # that safe — it only decides how the loser fails.
      SKIP_DATABASE_MIGRATIONS: "true"
    depends_on:
      database:
        condition: service_healthy
    # The base image probes the web server this container does not run, so the
    # worker reports unhealthy for its entire life. A permanent red light hides
    # the one it should have shown: a worker that actually died, taking
    # magic-link sign-in with it.
    healthcheck:
      disable: true
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sendvery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sendvery"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

volumes:
  pgdata:

networks:
  traefik:
    external: true
